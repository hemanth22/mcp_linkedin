name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live LinkedIn test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Pytest (offline, mocked network)
        run: pytest -v

  http-smoke:
    name: HTTP transport smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start server
        run: |
          python main.py --transport http --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/mcp; then exit 0; fi
            sleep 1
          done
          cat server.log; exit 1
      - name: MCP handshake + list tools
        run: python tests/smoke_http.py http://127.0.0.1:8000/mcp
      - name: Server log
        if: always()
        run: cat server.log

  live:
    name: Live LinkedIn test
    if: inputs.live
    runs-on: ubuntu-latest
    continue-on-error: true # LinkedIn may block runner IPs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -rs tests/test_live.py
        env:
          RUN_LIVE_TESTS: "1"
